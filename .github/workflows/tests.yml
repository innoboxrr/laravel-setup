name: Tests

# La definicion vive en innoboxrr/.github para que sea la misma en todo el
# ecosistema: instala, comprueba la sintaxis, audita contra la linea base y
# corre la suite. Aqui solo se declara cuando corre.
on:
    push:
        branches: [master]
    pull_request:

jobs:
    tests:
        uses: innoboxrr/.github/.github/workflows/php-tests.yml@main

    # Las interfaces se copian tal cual a cada aplicación nueva: si sus tests
    # fallan, no se publica.
    frontend:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                ui: [vue, react]

        name: Interfaz ${{ matrix.ui }}

        defaults:
            run:
                working-directory: tests/Frontend/${{ matrix.ui }}

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22

            - run: npm install --no-audit --no-fund

            - run: npx vitest run
